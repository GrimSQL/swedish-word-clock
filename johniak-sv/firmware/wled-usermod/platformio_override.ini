# Ordklockan — svensk word clock, ESP32 DevKit v1 (ESP32-D0WD-V3, 4 MB flash)
#
# Speglar [env:esp32dev] rakt av, med två skillnader:
#   - custom_usermods pekar på den svenska ordklockan i stället för audioreactive
#   - inget annat rörs, så OTA-binären är kompatibel med den installerade builden
#
# WLED_RELEASE_NAME lämnas som "ESP32" med flit — samma som lagerbygget, så att
# OTA-uppdateringen inte kan råka avvisa binären.
#
# WLED_ENABLE_JSONLIVE ger /json/live, som Lovelace-kortet speglar väggen med.
# Endpointen finns i källkoden men kompileras bara in när websockets är AV
# (wled.h: den ligger i #else-grenen), och vi vill ha båda. Flaggan på
# kommandoraden räcker — #ifdef-vakten i json.cpp ser den, och #else-grenen
# tas aldrig, så ingen omdefinition. Utan den svarar /json/live {"error":4}.

[platformio]
default_envs = ordklockan

[env:ordklockan]
board = esp32dev
platform = ${esp32_idf_V4.platform}
platform_packages = ${esp32_idf_V4.platform_packages}
build_unflags = ${common.build_unflags}
custom_usermods = usermod_v2_word_clock_sv
build_flags = ${common.build_flags} ${esp32_idf_V4.build_flags} -D WLED_RELEASE_NAME=\"ESP32\"
              -DARDUINO_USB_CDC_ON_BOOT=0
              -D WLED_ENABLE_JSONLIVE
lib_deps = ${esp32_idf_V4.lib_deps}
monitor_filters = esp32_exception_decoder
board_build.partitions = ${esp32.default_partitions}
board_build.flash_mode = dio

# Ordklockan — svensk word clock (WLED + egen usermod)
#
# WLED:s presets kan inte sjalva vaxla visningslaget: WLED utesluter
# usermod-tillstand nar en preset sparas (serializeState anropas med
# forPreset=true, och da hoppas UsermodManager::addToJsonState over). Darfor
# satter vi laget harifran i stallet, med ett REST-anrop mot /json/state.
#
# Laget ar ETT falt, inte flera flaggor - tva booleans hade kunnat sta i
# konflikt (klocka OCH hjarta samtidigt), ett lage kan inte.
#
#   klocka                          tiden i ord
#   hjarta stjarna gran snoflinga   figurer
#   katt blixt utrop
#   tal          + varde            tvasiffrig display, -99..99
#   nedrakning   + varde            sekunder, firmwaren tickar sjalv
#   av                              hela matrisen fri at effekten
#
# Scen-scriptet satter laget FORST och presetet sen. WLED nollstaller "aktiv
# preset" vid varje efterfoljande tillstandsandring, sa omvand ordning tommer
# select.ordklockan_preset och slacker kortets markering.
#
# OBS: allt av samma sort maste ligga i ETT block. Tva rest_command:-nycklar i
# samma fil ar inte ett fel i YAML - den sista vinner och den forsta forsvinner
# tyst. Lagg till nya poster i blocken nedan, skapa aldrig ett andra block.

input_boolean:
  # Manuell styrning vinner over automationerna. Satts av knapparna pa kortet
  # (via scripten, som alla har ett 'manuell'-falt som ar sant som default) och
  # nollstalls nar huset larmas borta eller klockan 04. Utan den skulle
  # solnedgangsautomationen sla over ett hjarta man precis valt.
  ordklockan_manuell:
    name: Ordklockan manuell styrning
    icon: mdi:hand-back-right

input_text:
  ordklockan_sensor:
    name: Ordklockan vald sensor
    icon: mdi:thermometer
    max: 255

rest_command:
  # Visningslage. Anropas med data: {lage: hjarta}
  ordklockan_lage:
    url: "http://192.168.30.17/json/state"
    method: POST
    content_type: "application/json"
    payload: '{"Ordklockan":{"mode":"{{ lage }}"}}'
    timeout: 10

  # Genvagar for snabbknapparna pa kortet.
  ordklockan_ord_pa:
    url: "http://192.168.30.17/json/state"
    method: POST
    content_type: "application/json"
    payload: '{"Ordklockan":{"mode":"klocka"}}'
    timeout: 10

  ordklockan_ord_av:
    url: "http://192.168.30.17/json/state"
    method: POST
    content_type: "application/json"
    payload: '{"Ordklockan":{"mode":"av"}}'
    timeout: 10

  # Statiskt tal, -99..99. Temperatur och andra matvarden.
  ordklockan_tal:
    url: "http://192.168.30.17/json/state"
    method: POST
    content_type: "application/json"
    payload: '{"Ordklockan":{"mode":"tal","varde":{{ varde | int(0) }}}}'
    timeout: 10

  # Nedrakning i sekunder. Firmwaren tickar sjalv en gang per sekund, sa det
  # blir inga 99 HTTP-anrop och den fortsatter aven om HA startar om.
  ordklockan_nedrakning:
    url: "http://192.168.30.17/json/state"
    method: POST
    content_type: "application/json"
    payload: '{"Ordklockan":{"mode":"nedrakning","varde":{{ varde | int(0) }}}}'
    timeout: 10

sensor:
  # Vad vaggen faktiskt sager just nu, direkt fran usermoden.
  - platform: rest
    name: Ordklockan text
    unique_id: ordklockan_text
    resource: "http://192.168.30.17/json/info"
    value_template: "{{ value_json.u.Ordklockan[0] }}"
    scan_interval: 15
    timeout: 10

  # 110 tecken, '1' = tand cell, i lasordning (rad 0 overst, kolumn 0 till
  # vanster). Firmwarens EGEN mask - simulatorkortet ritar den rakt av och kan
  # darfor aldrig saga emot vaggen.
  - platform: rest
    name: Ordklockan rutnät
    unique_id: ordklockan_rutnat
    resource: "http://192.168.30.17/json/info"
    value_template: "{{ value_json.u.OrdklockanRutnat[0] }}"
    scan_interval: 15
    timeout: 10

  # Aktuellt visningslage.
  - platform: rest
    name: Ordklockan läge
    unique_id: ordklockan_lage
    resource: "http://192.168.30.17/json/state"
    value_template: "{{ value_json.Ordklockan.mode }}"
    scan_interval: 15
    timeout: 10

  # Sekunder kvar i nedrakningen. Gor det mojligt att trigga nar den nar noll.
  - platform: rest
    name: Ordklockan nedräkning
    unique_id: ordklockan_nedrakning
    resource: "http://192.168.30.17/json/state"
    value_template: "{{ value_json.Ordklockan.varde | default(0) }}"
    unit_of_measurement: "s"
    scan_interval: 10
    timeout: 10

binary_sensor:
  # Visar den nagot alls? True for klocka, figurer och tal.
  - platform: rest
    name: Ordklockan klocklage
    unique_id: ordklockan_klocklage
    resource: "http://192.168.30.17/json/state"
    value_template: "{{ value_json.Ordklockan.on }}"
    scan_interval: 30
    timeout: 10

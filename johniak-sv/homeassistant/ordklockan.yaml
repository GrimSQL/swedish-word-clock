# Ordklockan — svensk word clock (WLED + egen usermod)
#
# WLED:s presets kan inte sjalva vaxla visningslaget: WLED utesluter
# usermod-tillstand nar en preset sparas (serializeState anropas med
# forPreset=true, och da hoppas UsermodManager::addToJsonState over). Darfor
# satter vi laget harifran i stallet, med ett REST-anrop mot /json/state.
#
# Laget ar ETT falt, inte flera flaggor - tva booleans hade kunnat sta i
# konflikt (klocka OCH hjarta samtidigt), ett lage kan inte.
#
#   klocka   tiden i ord
#   hjarta   ett hjarta
#   stjarna  en stjarna
#   av       hela matrisen fri at effekten
#
# Scen-scriptet (script.ordklockan_scen) satter laget FORST och presetet sen.
# WLED nollstaller "aktiv preset" vid varje efterfoljande tillstandsandring, sa
# omvand ordning tommer select.ordklockan_preset och slacker kortets markering.

rest_command:
  # Ett kommando for alla lagen. Anropas med data: {lage: hjarta}
  ordklockan_lage:
    url: "http://192.168.30.17/json/state"
    method: POST
    content_type: "application/json"
    payload: '{"Ordklockan":{"mode":"{{ lage }}"}}'
    timeout: 10

  # Behalls som genvagar - anvands av snabbknapparna pa kortet.
  ordklockan_ord_pa:
    url: "http://192.168.30.17/json/state"
    method: POST
    content_type: "application/json"
    payload: '{"Ordklockan":{"mode":"klocka"}}'
    timeout: 10

  ordklockan_ord_av:
    url: "http://192.168.30.17/json/state"
    method: POST
    content_type: "application/json"
    payload: '{"Ordklockan":{"mode":"av"}}'
    timeout: 10

sensor:
  # Vad vaggen faktiskt sager just nu, direkt fran usermoden.
  # "KLOCKAN AR TJUGO OVER SJU" / "HJARTA" / "STJARNA" / "av"
  - platform: rest
    name: Ordklockan text
    unique_id: ordklockan_text
    resource: "http://192.168.30.17/json/info"
    value_template: "{{ value_json.u.Ordklockan[0] }}"
    scan_interval: 15
    timeout: 10

  # 110 tecken, '1' = tand cell, i lasordning (rad 0 overst, kolumn 0 till
  # vanster). Firmwarens EGEN mask, inte en gissning - simulatorkortet ritar
  # den rakt av och kan darfor aldrig saga emot vaggen.
  - platform: rest
    name: Ordklockan rutnät
    unique_id: ordklockan_rutnat
    resource: "http://192.168.30.17/json/info"
    value_template: "{{ value_json.u.OrdklockanRutnat[0] }}"
    scan_interval: 15
    timeout: 10

  # Aktuellt visningslage: klocka / hjarta / stjarna / av
  - platform: rest
    name: Ordklockan läge
    unique_id: ordklockan_lage
    resource: "http://192.168.30.17/json/state"
    value_template: "{{ value_json.Ordklockan.mode }}"
    scan_interval: 15
    timeout: 10

binary_sensor:
  # Visar den nagot alls? True for klocka, hjarta och stjarna.
  - platform: rest
    name: Ordklockan klocklage
    unique_id: ordklockan_klocklage
    resource: "http://192.168.30.17/json/state"
    value_template: "{{ value_json.Ordklockan.on }}"
    scan_interval: 30
    timeout: 10
